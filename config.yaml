feedback:
  base_url: http://localhost:5000
  enabled: true
  learning:
    adjustment_factor: 0.1
    min_feedback_count: 5
  port: 5000
filter:
  blacklist_categories: []
  blacklist_ids: []
  blacklist_keywords:
  - 拼多多
  - pdd
  - 百亿补贴
  blacklist_malls: []
  whitelist_ids: []
  whitelist_keywords: []
monitor:
  channel_types:
  - faxian
  - youhui
  interval: 300
  items_per_page: 20
  target_minutes: 30
  quiet_hours:
    enabled: true
    start: '00:30'
    end: '07:30'
  max_history_hours: 24
  max_pages: 50
notifier:
  email:
    enabled: true
    from_name: SMZDM好价监控
    smtp_port: 587
    smtp_server: smtp.qq.com
    to_email: 809153781@qq.com
    use_tls: true
    username: 320964718@qq.com
  limits:
    max_items_per_batch: 20
    max_notifications_per_item: 2
  template: default
proxy:
  api_key: ''
  api_url: ''
  enabled: false
  free_sources:
  - https://proxylist.geonode.com/api/proxy-list?limit=100&page=1&sort_by=lastChecked&sort_type=desc&protocols=socks5,http&country=CN
  - https://www.proxy-list.download/api/v1/get?type=http
  rotation:
    max_failures: 3
    on_failure: true
    on_request: true
  source: free
  validation:
    enabled: true
    test_url: https://httpbin.org/ip
    timeout: 10
scorer:
  filters:
    min_worthy: 15
    min_comments: 1
    max_price: 30000
  min_age_hours: 0
  min_composite_score: 50
  weights:
    comments: 0.1
    collection: 3
    worthy: 1.5
    unworthy: -2
    price: 0.15
logging:
  backup_count: 5
  console: true
  file: ./logs/smzdm.log
  level: INFO
  max_size: 10
  max_days: 30
  max_size_mb: 10
storage:
  auto_cleanup: true
  db_path: ./data/smzdm.db
  retention_days: 30
